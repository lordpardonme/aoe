name: Deploy Production Orbit

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Production Release & Gatekeeper
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: http://localhost:8000

    steps:
      - name: Checkout Production Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Production Integrity Audit
        run: |
          python -c "
          from pathlib import Path
          print('Running production sanity check...')
          assert Path('run_app.py').exists()
          assert Path('job-agent/src/web/app.py').exists()
          print('Production artifacts verified clean.')
          "

      - name: Publish Production Deployment Notice
        run: |
          echo "### 🟢 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`Production (Live Orbit)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Port**: \`8000\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: Production \`jobhunt.db\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Safety Lock**: Activation Passkey Protected" >> $GITHUB_STEP_SUMMARY
